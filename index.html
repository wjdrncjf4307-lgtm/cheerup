<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리 반 실시간 응원 메시지 보드</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff8ed;color:#393244;font:18px/1.6 system-ui,-apple-system,"맑은 고딕",sans-serif}main{max-width:920px;margin:auto;padding:32px 20px 48px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.brand{font-weight:800;color:#7b5088}.status{font-size:16px;padding:8px 14px;background:white;border:1px solid #e2d7c8;border-radius:24px}h1{font-size:clamp(30px,5vw,46px);line-height:1.25;letter-spacing:-.04em;margin:28px 0 12px}.intro{color:#706374;margin:0 0 28px}.compose{background:#fff;border:1px solid #ebddcf;border-radius:26px;padding:24px;box-shadow:0 8px 0 #8a673408}.fields{display:grid;grid-template-columns:180px minmax(0,1fr);gap:20px}label{display:block;font-weight:750;margin-bottom:8px}input,button{font:inherit}input{width:100%;min-width:0;padding:14px;border:2px solid #e4dbe6;border-radius:14px;color:#393244;background:#fffdfd}input:focus{border-color:#9470ad;outline:2px solid #e6dbef}input[aria-invalid="true"]{border-color:#b34250}.hint{font-size:16px;color:#756979;margin-top:6px}.error{font-size:16px;color:#a52b42;min-height:26px;margin-top:4px}.actions{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:12px}button{min-height:50px;padding:12px 32px;border:0;border-radius:14px;background:#77518d;color:white;font-weight:750;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible{outline:3px solid #bba0ce;outline-offset:4px}.feedback{font-size:16px;margin:0;flex:1;min-width:180px;overflow-wrap:anywhere}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:32px 0 16px}h2{font-size:22px;margin:0}.tag{font-size:16px;color:#776879}.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}.card{position:relative;border-radius:22px 22px 22px 5px;background:#fff0bd;padding:22px;overflow-wrap:anywhere;animation:arrive .45s both}.card:nth-child(3n+2){background:#f6dce5}.card:nth-child(3n){background:#e0eddc}.card p{font-size:22px;margin:0 0 18px;white-space:pre-wrap}.card footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:16px}.card time{color:#6d6070;font-size:16px}.empty{grid-column:1/-1;text-align:center;background:#fffdf8;border:2px dashed #e9dac8;border-radius:24px;padding:42px 16px;color:#7a6d74}.total{text-align:center;font-size:22px;font-weight:750;margin-top:30px}.total strong{color:#77518d;font-size:30px}.shake{animation:shake .3s}@keyframes shake{25%,75%{transform:translateX(-5px)}50%{transform:translateX(5px)}}@keyframes arrive{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@media(max-width:600px){main{padding:20px 16px 32px}.fields,.board{grid-template-columns:1fr}.compose{padding:20px}.fields{gap:8px}.actions button{width:100%}.card p{font-size:20px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body><main>
<header><div class="brand">🌷 우리 반 마음 우체통</div><div id="connection" class="status" role="status">연결 확인 중…</div></header>
<h1>따뜻한 한마디를 보내요</h1><p class="intro">응원하고 싶은 마음을 적어 주세요. 우리 반 모두에게 바로 전해져요.</p>
<form id="form" class="compose" novalidate><div class="fields"><div><label for="name">이름</label><input id="name" placeholder="이름 또는 별명" autocomplete="off" aria-describedby="nameHint nameError"><div class="hint" id="nameHint">1~10자</div><div id="nameError" class="error" role="alert"></div></div><div><label for="message">응원 메시지</label><input id="message" placeholder="오늘도 함께해서 즐거워요!" autocomplete="off" aria-describedby="messageHint messageError"><div class="hint" id="messageHint">1~50자 · 입력 후 Enter로 보내기</div><div id="messageError" class="error" role="alert"></div></div></div><div class="actions"><p id="feedback" class="feedback" role="status">연결되면 메시지를 보낼 수 있어요.</p><button id="send" type="submit" disabled>보내기 ↗</button></div></form>
<div class="section-head"><h2>우리 반 응원 메시지</h2><span class="tag">새 메시지부터</span></div><section id="board" class="board" aria-label="우리 반 응원 메시지"><p class="empty">메시지를 불러오는 중이에요.</p></section><footer class="total" aria-live="polite">지금까지 메시지 <strong id="count">—</strong>개</footer>
</main>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>
<script>
'use strict';
// 앞서 제공된 Firebase 프로젝트를 사용합니다. 이 보드의 경로는 practice/messages입니다.
const firebaseConfig = {
apiKey: "AIzaSyAKS2yoFfR5HtTLBubHP0d9A39G38uTC6g",
authDomain: "project-4995563343051267418.firebaseapp.com",
databaseURL: "[https://project-4995563343051267418-default-rtdb.asia-southeast1.firebasedatabase.app](https://project-4995563343051267418-default-rtdb.asia-southeast1.firebasedatabase.app)",
projectId: "project-4995563343051267418",
storageBucket: "project-4995563343051267418.firebasestorage.app",
messagingSenderId: "140132214441",
appId: "1:140132214441:web:ab2fb1362aec4568acebb8"
};
const $=id=>document.getElementById(id);
const length=text=>Array.from(text).length;
let connected=false,ready=false,denied=false,sending=false,composing=false,compositionEnd=0,ref=null,pendingKey=null,rows=[];
let previous=new Map();
function controls(){ $('send').disabled=!connected||!ready||denied||sending;$('send').textContent=sending?'저장 확인 중…':'보내기 ↗';if(sending)$('send').textContent='저장 확인 중…';$('connection').textContent=denied?'데이터 접근 실패':connected&&ready?'● 실시간 연결됨':connected?'메시지 불러오는 중…':'○ 연결 끊김 · 다시 연결 중'; }
function invalid(id,text){const field=$(id);$(id+'Error').textContent=text;field.setAttribute('aria-invalid','true');field.classList.remove('shake');void field.offsetWidth;field.classList.add('shake');}
['name','message'].forEach(id=>$(id).addEventListener('input',()=>{$(id+'Error').textContent='';$(id).removeAttribute('aria-invalid');}));
$('message').addEventListener('compositionstart',()=>composing=true);
$('message').addEventListener('compositionend',()=>{composing=false;compositionEnd=performance.now();});
$('message').addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.isComposing||composing||e.keyCode===229||performance.now()-compositionEnd<100){return;}e.preventDefault();$('form').requestSubmit();});
function render(){const valid=rows.filter(r=>r.key!==pendingKey&&typeof r.name==='string'&&typeof r.message==='string'&&length(r.name.trim())>=1&&length(r.name.trim())<=10&&length(r.message.trim())>=1&&length(r.message.trim())<=50);valid.sort((a,b)=>(Number(b.createdAt)||0)-(Number(a.createdAt)||0)||b.key.localeCompare(a.key));$('count').textContent=valid.length.toLocaleString('ko-KR');const board=$('board');const next=new Map();board.querySelectorAll('.empty').forEach(n=>n.remove());for(const row of valid){let card=previous.get(row.key);if(!card){card=document.createElement('article');card.className='card';const p=document.createElement('p');const footer=document.createElement('footer');footer.append(document.createElement('strong'),document.createElement('time'));card.append(p,footer);}card.querySelector('p').textContent=row.message;card.querySelector('strong').textContent=row.name;const time=card.querySelector('time');const date=new Date(row.createdAt);time.textContent=Number.isFinite(row.createdAt)&&!isNaN(date)?date.toLocaleString('ko-KR',{month:'long',day:'numeric',hour:'numeric',minute:'2-digit'}):'방금';board.appendChild(card);next.set(row.key,card);}previous.forEach((node,key)=>{if(!next.has(key))node.remove();});previous=next;if(!valid.length){const p=document.createElement('p');p.className='empty';p.textContent='아직 메시지가 없어요. 첫 응원을 남겨 주세요!';board.appendChild(p);}}
$('form').addEventListener('submit',async e=>{e.preventDefault();if(composing||performance.now()-compositionEnd<100||sending)return;const name=$('name').value.trim(),message=$('message').value.trim();let first=null;if(length(name)<1||length(name)>10){invalid('name','이름을 1~10자로 입력해 주세요.');first='name';}if(length(message)<1||length(message)>50){invalid('message','메시지를 1~50자로 입력해 주세요.');first=first||'message';}if(first){$(first).focus();return;}if(!connected||!ready||denied||!ref){$('feedback').textContent='연결을 확인한 후 다시 보내 주세요.';return;}sending=true;controls();const child=ref.push();pendingKey=child.key;$('feedback').textContent='저장 확인 중이에요. 확인될 때까지 이 창을 닫지 마세요.';try{await child.set({name,message,createdAt:firebase.database.ServerValue.TIMESTAMP});pendingKey=null;render();if($('message').value.trim()===message)$('message').value='';$('feedback').textContent='응원 메시지를 보냈어요!';$('message').focus();}catch(error){rows=rows.filter(r=>r.key!==pendingKey);pendingKey=null;render();$('feedback').textContent='전송하지 못했어요. 입력 내용은 남겨 두었어요. 연결과 데이터베이스 규칙을 확인한 뒤 다시 보내 주세요.';}finally{sending=false;controls();}});
try{if(typeof firebase==='undefined')throw new Error('스크립트');const config={...firebaseConfig};const match=config.databaseURL.match(/^\[[^\]]+\]\((https:\/\/[^)]+)\)$/);if(match)config.databaseURL=match[1];firebase.initializeApp(config);const db=firebase.database();ref=db.ref('practice/messages');db.ref('.info/connected').on('value',s=>{connected=s.val()===true;controls();});ref.on('value',s=>{rows=[];s.forEach(child=>{const value=child.val();if(value&&typeof value==='object')rows.push({...value,key:child.key});});ready=true;denied=false;render();controls();if(!sending)$('feedback').textContent='메시지를 적고 보내기를 눌러 주세요.';},()=>{denied=true;ready=false;controls();$('feedback').textContent='메시지를 읽을 수 없어요. Firebase의 데이터베이스 규칙을 확인하고 파일을 다시 열어 주세요.';$('board').textContent='메시지 불러오기에 실패했어요.';});}catch(error){$('connection').textContent='연결 시작 실패';$('feedback').textContent='인터넷 연결과 Firebase 설정을 확인한 뒤 파일을 다시 열어 주세요.';$('board').textContent='메시지를 불러올 수 없어요.';}
</script></body></html>
